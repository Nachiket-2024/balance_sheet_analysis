name: CI

# Runs on every push and pull request targeting main. Five independent jobs
# (backend, frontend, secrets scan, docker build, docker full suite) run in
# parallel, though the last of these only actually executes on a push to main
# (not on pull_request), see its own job below for why.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: none of these jobs need write access, they only
# check out code and run tests/builds. Explicit here rather than relying on
# the repo/org's default GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        # AWS ECR Public mirror of the Docker Official postgres image, not
        # Docker Hub directly, since this sidesteps Docker Hub's anonymous-pull rate
        # limiting, which is the most common cause of GitHub-hosted runners
        # timing out ("context deadline exceeded") pulling service containers.
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mystic_auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mystic_auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        # Same ECR Public mirror reasoning as postgres above.
        image: public.ecr.aws/docker/library/redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Test-only values, never real secrets. Settings requires every one
      # of these to be set, so CI provides them directly as environment
      # variables instead of using a checked-in .env file.
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mystic_auth_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mystic_auth_ci

      SECRET_KEY: ci-test-secret-key-not-for-production-use-only

      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_MINUTES: "43200"
      JWT_ALGORITHM: HS256
      RESET_TOKEN_EXPIRE_MINUTES: "60"

      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/oauth2/callback/google

      REDIS_URL: redis://localhost:6379/0
      CACHE_DEFAULT_TTL: "300"

      FROM_EMAIL: ci-test@example.com
      GMAIL_APP_PASSWORD: ci-test-app-password

      APP_NAME: MysticAuth

      LOGIN_LOCKOUT_TIME: "300"
      MAX_FAILED_LOGIN_ATTEMPTS: "5"
      LOGIN_LOCKOUT_TIME_PER_IP: "300"
      MAX_FAILED_LOGIN_ATTEMPTS_PER_IP: "20"

      MAX_REQUESTS_PER_WINDOW: "100"
      REQUEST_WINDOW_SECONDS: "60"

      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r backend/requirements.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app mystic_auth alembic ../tests/backend

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app mystic_auth

      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -r app mystic_auth -c pyproject.toml

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      # Regression guard: fails if a model's columns/indexes drift from what
      # the migrations actually create.
      - name: Verify models match migrations (alembic check)
        working-directory: backend
        run: alembic check

      # tests/backend/app covers the app/ wrapper layer; tests/backend/mystic_auth/unit
      # covers the mystic_auth/ package. Both are fast, no-DB, and run as one coverage base.
      - name: Run backend unit tests
        run: python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q

      # --cov-append accumulates onto the unit run's coverage data, so the
      # threshold below gates cumulative unit+integration+security coverage.
      - name: Run backend integration tests
        run: python -m pytest tests/backend/mystic_auth/integration -q --cov-append

      # Coverage is currently ~89% (see docs/mystic_auth/testing/overview.md); the gate
      # is a regression alarm a few points below that, not a strict target.
      - name: Run backend security tests
        run: python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85

      # Non-blocking: asserts generous regression-alarm thresholds against a
      # real Postgres/Redis, so timing can be noisy on shared runners.
      - name: Run backend performance tests (non-blocking)
        continue-on-error: true
        run: python -m pytest tests/backend/mystic_auth/performance -q

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned patch version, matching docker/frontend.Dockerfile: react-router
          # 8.x and @testing-library/jest-dom 7.x both declare an engines.node
          # floor of 22 (22.22.0 for react-router specifically), above what
          # Node 20 (this repo's previous pin) satisfies.
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies for known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # test:coverage (not plain test) so vitest.config.ts's coverage
      # thresholds are actually evaluated.
      - name: Run tests (with coverage threshold gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history, not just the working tree, so it needs
          # the full commit log, not just the last commit, to catch a
          # secret that was committed and later removed.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker image build verification
    runs-on: ubuntu-latest

    # Confirms backend and frontend Dockerfiles still build correctly, and
    # (via the smoke-test steps below) that the actual dev compose stack
    # boots and serves traffic, catching a class of bug (bad env wiring in
    # docker-compose.yml, a broken healthcheck, a missing file the app needs
    # at runtime) the backend/frontend jobs above can't see at all, since
    # those run the same source code on a bare runner, never through this
    # image. This does NOT re-run the test suite through Docker: that's
    # what docker-full-suite (below) does, only on a push to main, since
    # re-running identical tests through Docker on every PR
    # would mostly just double CI time for no new bug-catching power over
    # the native runs above.

    steps:
      - uses: actions/checkout@v4

      # Validates both compose files still parse and reference existing
      # service dependencies. Uses .env.example only to satisfy each file's
      # `env_file: ./.env` directive, no real secrets involved.
      - name: Validate docker-compose configs
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          rm .env

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t backend:ci .

      - name: Build frontend production image
        run: docker build --target production -f docker/frontend.Dockerfile -t frontend:ci .

      # Regression guard: backend/logs/ (real request data) was previously
      # getting baked into the image via `COPY backend/ .`, since *.log alone
      # doesn't match rotated filenames like access.log.2026-07-19. Fixed via
      # .dockerignore; this catches it coming back.
      # /app/logs itself is now expected to exist (backend.Dockerfile creates
      # it, empty, so a Docker-managed volume mounted there in dev inherits
      # correct ownership from the image (see docker-compose.yml's own
      # comment on that volume). This checks it's EMPTY, i.e. nothing from
      # a local checkout leaked in via COPY, not that the directory itself
      # is absent.
      - name: Verify no local logs leaked into the backend image
        run: |
          docker run --rm backend:ci sh -c 'test -z "$(ls -A /app/logs 2>/dev/null)"' \
            && echo "OK: /app/logs exists but is empty in the built image" \
            || (echo "FAIL: /app/logs contains files copied into the built image, check .dockerignore" && exit 1)

      # Boots the real dev compose stack (same images/wiring a contributor's
      # `docker compose up` uses) and confirms it actually serves traffic.
      # bugsink/bugsink-seed/taskiq_worker are skipped here since nothing
      # below depends on them and they'd only add boot time.
      #
      # BUGSINK_SUPERUSER_EMAIL is blanked out here specifically because
      # bugsink/bugsink-seed aren't part of this invocation: the backend's
      # own startup command waits up to ~10s for a Bugsink DSN file that,
      # without this override, would never arrive, wasting ~10s of an
      # already-tight boot budget on a shared CI runner for no reason. Real
      # users running plain `docker compose up` (which does include Bugsink)
      # keep the default, so this override is CI-only and never reaches a
      # real deployment.
      - name: Boot the dev stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic seed-base-policies backend frontend

      - name: Wait for backend to report healthy
        run: timeout 150 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      - name: Wait for frontend dev server to respond
        run: timeout 60 sh -c 'until curl -sf http://localhost:5173 >/dev/null 2>&1; do sleep 3; done'

      - name: Smoke-test the booted stack
        run: |
          curl -sf http://localhost:8000/health/ready | grep -q '"status":"ok"' \
            && echo "OK: backend /health/ready reports ok through the actual image"
          curl -sf http://localhost:5173 | grep -qi '<div id="root">' \
            && echo "OK: frontend dev server serves the app shell through the actual image"

      # Only ever runs when something above actually failed. Prints the
      # containers' own logs so a CI failure shows *why* a container never
      # became healthy instead of just "unhealthy"/a timeout with no context.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the dev stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env

  # Re-runs the FULL backend + frontend suites through the actual dev
  # compose stack (not bare runners). This is the expensive, high-fidelity
  # check the backend/frontend jobs above intentionally don't do on every
  # PR, since the code under test is identical either way and doubling CI
  # time on every push buys little over the native runs above. This job is
  # what catches the narrower class of bug the native runs structurally
  # can't: something specific to how the containers/images/compose wiring
  # behave (a subtly wrong volume mount, an entrypoint issue, a dependency
  # that's present on the runner but missing from the image). Gated to a
  # push to main (not pull_request), since that's the point you're actually
  # merging something in, which is when you'd want to know if this broke;
  # deliberately no separate nightly schedule on top of that, since a push
  # to main already fires this on every real change to the repo, and a
  # schedule would just add a permanent daily cost for the narrow, rare case
  # of unrelated upstream base-image drift with no corresponding commit.
  docker-full-suite:
    name: Full test suite via Docker (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # See docker-build's identical override above for why
      # BUGSINK_SUPERUSER_EMAIL is blanked here (CI-only), never reaches a
      # real deployment.
      - name: Boot the backend stack
        run: |
          cp .env.example .env
          sed -i 's/^BUGSINK_SUPERUSER_EMAIL=.*/BUGSINK_SUPERUSER_EMAIL=/' .env
          docker compose up -d --build postgres redis alembic seed-base-policies backend

      - name: Wait for backend to report healthy
        run: timeout 180 sh -c 'until curl -sf http://localhost:8000/health/ready >/dev/null 2>&1; do sleep 3; done'

      # Same three tiers, same flags, as the native backend job above.
      # This is a repeat, not a different set of tests, run through the
      # actual container this time instead of a bare runner.
      #
      # --user root: pytest-cov writes its .coverage database (and
      # --cov-report=html's htmlcov/) to the current working directory,
      # here, /repo, the whole-repo bind mount, owned by whatever checked it
      # out (the runner's own user on GitHub Actions, not the container's
      # non-root `app` user). That's a broader version of the exact same
      # class of bug backend_logs's volumes fix this repo's own /app/logs
      # and /repo/backend/logs, but coverage's own output files are
      # spread across whatever cwd it's given, not one fixed path, so
      # carving out another individual named-volume mount per file doesn't
      # scale. Running this one-off test invocation as root sidesteps the
      # whole class at once: nothing here is the actual served application
      # (which stays non-root by default, per backend.Dockerfile's `USER
      # app`), just a throwaway test run inside a container that's torn
      # down immediately after.
      - name: Run the full backend suite inside the backend container
        run: |
          docker compose exec -T --user root backend bash -c '
            cd /repo &&
            python -m pytest tests/backend/app tests/backend/mystic_auth/unit -q &&
            python -m pytest tests/backend/mystic_auth/integration -q --cov-append &&
            python -m pytest tests/backend/mystic_auth/security -q --cov-append --cov-fail-under=85
          '

      - name: Boot the frontend
        run: docker compose up -d --build frontend

      - name: Run the full frontend suite inside the frontend container
        run: docker compose exec -T frontend sh -c "npm run test -- --run"

      # Only ever runs when something above actually failed, see
      # docker-build's identical step for why.
      - name: Show container logs (only runs on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          rm -f .env