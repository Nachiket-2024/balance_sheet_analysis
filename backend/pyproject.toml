[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Rules focus on correctness and real bug classes. Style-only rule families
# are avoided to prevent churn in an existing codebase.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "E501",   # line-length above is the source of truth.
    "B008",   # FastAPI uses Depends(...) as a default argument by design.
    "UP042",  # str+Enum is kept for broader compatibility.
]

[tool.ruff.lint.isort]
known-first-party = ["app", "mystic_auth"]

[tool.ruff.lint.per-file-ignores]
# Interactive CLI entrypoint (invoked directly via `python -m`, never inside
# a running event loop doing concurrent work); input()/getpass() blocking
# is the correct, intended behavior here, not a footgun.
"mystic_auth/scripts/create_system_user.py" = ["ASYNC250"]
"mystic_auth/scripts/create_rbac_policies.py" = ["ASYNC250"]
# Env overrides must run before the backend.* imports below them, which build
# Settings()/engine/client singletons eagerly at import time from the process env.
"../tests/backend/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
# SQLAlchemy's plugin keeps ORM attributes and generated model constructors
# visible to mypy.
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.bandit]
# B105 (hardcoded_password_string) fires on any string literal assigned to a
# name/dict-key containing "password": here that's only ever event-name
# constants (e.g. PASSWORD_RESET_REQUESTED), a Redis key template, a URL, and
# `hashed_password: None` for OAuth-only accounts. No actual secret is
# hardcoded anywhere in this codebase; this rule is disabled project-wide
# rather than `#nosec`-annotated at each of its several call sites.
skips = ["B105"]
