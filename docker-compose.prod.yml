# ---------------------------- Production Compose ----------------------------
# Run with: docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#   - No bind mounts : images are self-contained, code isn't shared from host
#   - No --reload on backend/taskiq_worker
#   - frontend builds docker/frontend.Dockerfile's `production` target
#     (nginx serving the static Vite build) instead of the Vite dev server
#   - restart: unless-stopped on long-running services, so they recover from
#     crashes/host reboots without manual intervention
#   - deploy.resources.limits on every service, so a leak/runaway process in
#     one container can't starve the host or its siblings. `docker compose`
#     (Compose V2, not Swarm) enforces these directly via the container
#     runtime : no orchestrator required. Values are conservative starting
#     points, not load-tested; tune them against real traffic.
#
# Out of scope (by design : see CLAUDE.md "no unnecessary cloud-specific
# tooling"): this file assumes a reverse proxy / TLS terminator sits in
# front of it in a real deployment (e.g. nginx/Caddy/Traefik on the host,
# or a cloud load balancer) : it does not attempt to provision one.
services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # See docker-compose.yml's identical mount : creates the separate
      # "bugsink" database the Bugsink service below uses, once against a
      # fresh volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7
    restart: unless-stopped
    # See docker-compose.yml for the REDIS_PASSWORD rationale : in production
    # this should always be set.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    # Same DSN-wait rationale as docker-compose.yml's backend service: waits
    # for bugsink-seed to write SENTRY_DSN into the shared bugsink_dsn
    # volume, only when Bugsink is configured (BUGSINK_SUPERUSER_EMAIL set).
    # Bounded at ~10s so a slow/broken seed doesn't delay a normal boot. This
    # is safe to share with dev unchanged because SENTRY_DSN is a
    # container-to-container address (bugsink:8000) in both environments :
    # unlike VITE_SENTRY_DSN below, it never depends on how Bugsink is
    # reverse-proxied for public/browser access.
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/backend.env ] && . /shared/bugsink-dsn/backend.env && break
          sleep 0.5
        done
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully   # Don't serve traffic on a schema the migration hasn't applied yet
      seed-base-policies:
        condition: service_completed_successfully   # Don't serve traffic before the ready-to-assign role policies exist
    volumes:
      # Read-only: only bugsink-seed writes here (see that service below).
      - bugsink_dsn:/shared/bugsink-dsn:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      # See docker-compose.yml's identical healthcheck for why this budget
      # is 10 retries / 30s start_period rather than a tighter 5/10s.
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  frontend:
    # Explicit, prod-specific tag : see docker-compose.yml's frontend
    # service for why (avoids clobbering the dev image).
    image: mystic-auth-frontend:prod
    # Same reasoning as docker-compose.yml's frontend service: this tag is
    # never published anywhere, so without this, Compose attempts (and
    # always fails) a pull of it before falling back to building, on every
    # single run.
    pull_policy: build
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production                            # nginx + static build, not the Vite dev server
      # VITE_* vars are inlined into the static bundle at build time, not
      # read at runtime, so unlike the dev target they must be passed as
      # build args (sourced from the root .env : see .env.example).
      # VITE_SENTRY_DSN specifically can't be auto-wired from bugsink-seed
      # the way backend's SENTRY_DSN is above: it needs whatever *publicly*
      # reaches Bugsink in production (a reverse-proxy route you set up
      # deliberately, per Bugsink's no-exposed-port-by-default posture :
      # see docs/mystic_auth/error-monitoring/overview.md#security-notes),
      # which bugsink-seed has no way to know, and it's baked in at this
      # build step rather than read at container startup regardless. Set it
      # manually in .env once you know that address.
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  taskiq_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    command: sh -c "taskiq worker mystic_auth.taskiq_tasks.email_tasks:broker"
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    # Override backend.Dockerfile's inherited HEALTHCHECK, which curls
    # localhost:8000/health/ready : taskiq_worker shares that image but
    # serves no HTTP at all, so the inherited check always fails and
    # reports this container as permanently "unhealthy" even when the
    # worker itself is running fine. This checks the actual worker process
    # via /proc directly : this slim image has neither `pgrep` nor `ps`.
    healthcheck:
      test: ["CMD-SHELL", "for p in /proc/[0-9]*/cmdline; do grep -aq taskiq \"$$p\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # One-shot: runs migrations then exits. No restart policy : restarting it
  # would just re-apply an already-applied migration in a loop.
  alembic:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ./.env
    command: alembic upgrade head
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: creates this app's own baseline RBAC-shaped policies, then
  # exits. See docker-compose.yml's identical service / app/seed/seed_base_policies.py
  # for the full explanation. Idempotent by name : safe to re-run on every deploy.
  seed-base-policies:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - ./.env
    command: python -m app.seed.seed_base_policies
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      alembic:
        condition: service_completed_successfully

  # Self-hosted error monitoring : see docker-compose.yml's identical
  # service for the full explanation. Starts by default in production too:
  #   docker compose -f docker-compose.prod.yml up -d --build
  bugsink:
    image: bugsink/bugsink:2
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      # Unlike dev, this file assumes a reverse proxy/TLS terminator in
      # front (see header comment above).
      BEHIND_HTTPS_PROXY: "true"
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    # Same override as docker-compose.yml's identical service, for the same
    # reason : see there for the full explanation (why it must be a YAML
    # list, why `$$PORT`, why `--timeout 60`). Matters even more here: this
    # service is capped at 1 CPU below, making a worker actually starving
    # past Gunicorn's default 30s timeout under real load more likely, not
    # less, than in dev.
    command:
      - monofy
      - bugsink-show-version
      - "&&"
      - bugsink-manage
      - check
      - --deploy
      - --fail-level
      - WARNING
      - "&&"
      - bugsink-manage
      - migrate
      - snappea
      - --database=snappea
      - "&&"
      - bugsink-manage
      - migrate
      - "&&"
      - bugsink-manage
      - prestart
      - "&&"
      - gunicorn
      - --config
      - gunicorn.docker.conf.py
      - --timeout
      - "60"
      - --bind=0.0.0.0:$$PORT
      - --access-logfile
      - "-"
      - bugsink.wsgi
      - "|||"
      - bugsink-runsnappea
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health/ready').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # Runs once against a healthy bugsink, then exits : see docker-compose.yml's
  # identical service for the full explanation. No restart policy, same as
  # alembic above: it's one-shot and idempotent (get_or_create), not a
  # long-running process to keep alive.
  bugsink-seed:
    image: bugsink/bugsink:2
    # Root only for this one-shot container: the default non-root "bugsink"
    # user can't write into a fresh named volume (Docker creates those
    # root-owned by default), needed to write the DSN files below.
    user: root
    env_file:
      - ./.env
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BASE_URL: ${BUGSINK_BASE_URL}
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn
    command: |
      sh -c "bugsink-manage shell -c \"
      import os
      from django.contrib.auth import get_user_model
      from teams.models import Team, TeamMembership, TeamRole
      from projects.models import Project

      User = get_user_model()
      user = User.objects.get(username=os.environ['BUGSINK_SUPERUSER_EMAIL'])

      team, _ = Team.objects.get_or_create(name='MysticAuth')
      TeamMembership.objects.get_or_create(team=team, user=user, defaults={'role': TeamRole.ADMIN, 'accepted': True})
      project, _ = Project.objects.get_or_create(team=team, name='MysticAuth')

      key = project.sentry_key.hex
      os.makedirs('/shared/bugsink-dsn', exist_ok=True)
      with open('/shared/bugsink-dsn/backend.env', 'w') as f:
          f.write('export SENTRY_DSN=http://' + key + '@bugsink:8000/' + str(project.id) + chr(10))
      print('Seeded Bugsink project ' + str(project.id) + ', key ' + key)
      \""

volumes:
  postgres_data:
  # Shared between bugsink-seed (writer) and backend (reader) : see the
  # bugsink-seed service above for why this exists. Unlike docker-compose.yml,
  # frontend doesn't read from this: VITE_SENTRY_DSN is a build arg here (see
  # the frontend service above), not something read at container startup.
  bugsink_dsn:
