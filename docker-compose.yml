services:

  postgres:
    image: postgres:15
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once against a fresh volume. Creates the separate "bugsink" DB
      # the Bugsink service uses, on this same Postgres server. See
      # docker/postgres-init/init-bugsink-db.sh for the already-initialized-volume fallback.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Non-default host port to avoid colliding with other local Postgres
      # instances; containers still reach it at postgres:5432 internally.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    restart: always
    # Empty REDIS_PASSWORD (local-dev default) makes --requirepass a no-op.
    # Set it in .env to require auth. REDIS_URL must include it too.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      # Non-default host port, same rationale as postgres above.
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - ./.env
    # Wait up to ~10s for bugsink-seed to write backend SENTRY_DSN, only
    # when Bugsink is configured. Fresh Bugsink boots can take longer, so
    # error_monitoring/sentry_service.py also watches for the DSN after boot.
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/backend.env ] && . /shared/bugsink-dsn/backend.env && break
          sleep 0.5
        done
      fi
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir mystic_auth --access-log"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully   # Don't serve traffic on a schema the migration hasn't applied yet
      seed-base-policies:
        condition: service_completed_successfully   # Don't serve traffic before the ready-to-assign role policies exist
    volumes:
      - ./backend:/app
      # Docker-managed volume so /app/logs uses image-owned permissions
      # instead of host checkout ownership.
      - backend_logs:/app/logs
      # Whole repo root for running top-level tests inside the Docker network
      # with imports like `backend.app...` and container hostnames.
      - .:/repo
      # Same log volume at the /repo import path used by tests. LOG_DIR is
      # relative to `__file__`, so app and test import paths both need it.
      - backend_logs:/repo/backend/logs
      # Read-only: only bugsink-seed writes here (see that service below).
      - bugsink_dsn:/shared/bugsink-dsn:ro
    ports:
      - "8000:8000"
    healthcheck:
      # Defined here (not in the shared Dockerfile) since taskiq_worker/alembic
      # use the same image but serve no HTTP. Hits /health/ready, which checks
      # DB + Redis connectivity, not just the static "/" welcome route.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      # Generous budget for cold image builds and the optional Bugsink DSN
      # wait. Tighter values have failed on shared CI runners.
      retries: 10
      start_period: 30s

  frontend:
    # Explicit, dev-specific tag. Without it, Compose defaults to the same
    # image name docker-compose.local-prod.yml's frontend resolves to, so building
    # one after the other would silently overwrite the other's image.
    image: mystic-auth-frontend:dev
    # image + build needs pull_policy: build because this local tag is never
    # published. Otherwise Compose tries and fails to pull it first.
    pull_policy: build
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    working_dir: /app
    env_file:
      - ./.env
    # Same DSN-wait rationale as the backend service above. Bounded wait,
    # gated on BUGSINK_SUPERUSER_EMAIL so an unconfigured boot is unaffected.
    command: |
      sh -c "if [ -n \"$$BUGSINK_SUPERUSER_EMAIL\" ]; then
        for i in $$(seq 1 20); do
          [ -f /shared/bugsink-dsn/frontend.env ] && . /shared/bugsink-dsn/frontend.env && break
          sleep 0.5
        done
      fi
      exec npm run dev -- --host"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - bugsink_dsn:/shared/bugsink-dsn:ro
      # Vitest resolves ../tests/frontend relative to /app.
      - ./tests/frontend:/tests/frontend
      # Repo-root view for lint, which expects frontend/ and tests/frontend/
      # as siblings. Run lint from /repo/frontend inside the container.
      - .:/repo
    depends_on:
      backend:
        condition: service_healthy

  taskiq_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - ./.env
    command: sh -c "taskiq worker mystic_auth.taskiq_tasks.email_tasks:broker"
    environment:
      - REDIS_URL=${REDIS_URL}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully   # Don't process jobs against a schema the migration hasn't applied yet
    volumes:
      - ./backend:/app
      # Same reasoning as the backend service's identical volume above.
      - backend_logs:/app/logs
    # Override the backend image healthcheck. This container serves no HTTP,
    # so check for the taskiq process directly via /proc.
    healthcheck:
      test: ["CMD-SHELL", "for p in /proc/[0-9]*/cmdline; do grep -aq taskiq \"$$p\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  alembic:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - ./.env
    command: alembic upgrade head
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Same fix as the backend service's identical volume, and for the same
      # reason: importing mystic_auth (alembic/env.py does, to reach both
      # sets of models) creates /app/logs at import time via
      # logging_config.py, which the non-root `app` user can't do inside a
      # plain bind-mounted ./backend on a real Linux host (its ownership
      # comes from the host checkout, not the image) : this only ever
      # slipped through on Docker Desktop for Windows/macOS, whose bind
      # mounts don't enforce the same POSIX permissions, and surfaced as a
      # real CI failure (PermissionError) the first time this ran on a
      # native Linux runner.
      - backend_logs:/app/logs

  # Runs once after migrations, then exits: creates this app's own baseline
  # RBAC-shaped policies (see app/seed/seed_base_policies.py) so a fresh
  # install has ready-to-assign policies from the very first boot, not just
  # mystic_auth's own self_service/user_administration/system_superuser.
  # Same one-shot pattern as the alembic service above; idempotent by name,
  # so reruns on every `docker compose up` are safe.
  seed-base-policies:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    working_dir: /app
    env_file:
      - ./.env
    command: python -m app.seed.seed_base_policies
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PYTHONPATH=/app
    depends_on:
      alembic:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      # See the alembic service's identical volume/comment above: same
      # import-time /app/logs creation, same fix.
      - backend_logs:/app/logs

  # Self-hosted error monitoring. Sentry SDK compatible. See
  # docs/mystic_auth/error-monitoring/overview.md). Starts by default with `docker
  # compose up`. SENTRY_DSN (backend settings, frontend .env.example) is
  # what actually turns error reporting on; it stays unset regardless of
  # whether this container is running.
  bugsink:
    image: bugsink/bugsink:2
    restart: always
    env_file:
      - ./.env
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_SUPERUSER_EMAIL}:${BUGSINK_SUPERUSER_PASSWORD}
      PORT: "8000"
      # Same Postgres server, separate database. Avoids a second Postgres
      # container just for Bugsink (see postgres's init-bugsink-db.sh above).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BEHIND_HTTPS_PROXY: "false"
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8010}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Non-default host port, distinct from the backend's own 8000.
      - "8010:8000"
    # Same pipeline as the image's own default CMD (`docker inspect
    # bugsink/bugsink:2 --format '{{json .Config.Cmd}}'`), plus `--timeout
    # 60` on gunicorn: the image ships no request timeout, so a worker can
    # hit Gunicorn's 30s default under ordinary host CPU contention. Must
    # be a YAML list, not a string: Compose doesn't shell-interpret
    # `command:`, so a string truncates at the first `&&`/`|||` (monofy
    # interprets those, not a shell). `$$PORT` escapes Compose's own
    # `$VAR` interpolation so the literal reaches monofy/gunicorn.
    command:
      - monofy
      - bugsink-show-version
      - "&&"
      - bugsink-manage
      - check
      - --deploy
      - --fail-level
      - WARNING
      - "&&"
      - bugsink-manage
      - migrate
      - snappea
      - --database=snappea
      - "&&"
      - bugsink-manage
      - migrate
      - "&&"
      - bugsink-manage
      - prestart
      - "&&"
      - gunicorn
      - --config
      - gunicorn.docker.conf.py
      - --timeout
      - "60"
      - --bind=0.0.0.0:$$PORT
      - --access-logfile
      - "-"
      - bugsink.wsgi
      - "|||"
      - bugsink-runsnappea
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:8000/health/ready').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Runs once against a healthy bugsink, then exits. Creates Bugsink's
  # team/project (idempotent via get_or_create, so reruns never duplicate)
  # and writes the resulting DSNs into the bugsink_dsn volume, which
  # backend/frontend read at startup. This avoids a manual "create a
  # project, copy the DSN" step (see docs/mystic_auth/error-monitoring/overview.md).
  bugsink-seed:
    image: bugsink/bugsink:2
    # Root only for this one-shot container: the default non-root "bugsink"
    # user can't write into a fresh named volume (Docker creates those
    # root-owned by default), needed to write the DSN files below.
    user: root
    env_file:
      - ./.env
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bugsink
      BASE_URL: ${BUGSINK_BASE_URL:-http://localhost:8010}
    depends_on:
      bugsink:
        condition: service_healthy
    volumes:
      - bugsink_dsn:/shared/bugsink-dsn
    command: |
      sh -c "bugsink-manage shell -c \"
      import os
      from django.contrib.auth import get_user_model
      from teams.models import Team, TeamMembership, TeamRole
      from projects.models import Project

      User = get_user_model()
      user = User.objects.get(username=os.environ['BUGSINK_SUPERUSER_EMAIL'])

      team, _ = Team.objects.get_or_create(name='MysticAuth')
      TeamMembership.objects.get_or_create(team=team, user=user, defaults={'role': TeamRole.ADMIN, 'accepted': True})
      project, _ = Project.objects.get_or_create(team=team, name='MysticAuth')

      key = project.sentry_key.hex
      os.makedirs('/shared/bugsink-dsn', exist_ok=True)
      with open('/shared/bugsink-dsn/backend.env', 'w') as f:
          f.write('export SENTRY_DSN=http://' + key + '@bugsink:8000/' + str(project.id) + chr(10))
      with open('/shared/bugsink-dsn/frontend.env', 'w') as f:
          f.write('export VITE_SENTRY_DSN=http://' + key + '@localhost:8010/' + str(project.id) + chr(10))
      print('Seeded Bugsink project ' + str(project.id) + ', key ' + key)
      \""

volumes:
  postgres_data:
  # Shared between bugsink-seed (writer) and backend/frontend (readers) :
  # see the bugsink-seed service above for why this exists.
  bugsink_dsn:
  # Docker-managed, not a host bind mount. See backend/taskiq_worker's
  # identical comment on why: /app/logs needs ownership that comes from the
  # image, not from whatever owns the host's checkout.
  backend_logs:
